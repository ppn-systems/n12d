<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Nalix observability</title>
  <base href="/" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="_content/Nalix.Dashboard.Controls/tokens.css" />
  <link rel="stylesheet" href="_content/Nalix.Dashboard.Controls/ui.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="Nalix.Dashboard.styles.css" />
  <script type="importmap"></script>
  <script>
    // Apply the stored theme before first paint to avoid a light flash in dark mode.
    try {
      var s = JSON.parse(localStorage.getItem("n12d.settings") || "{}");
      if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
    } catch (e) { }
  </script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-mark">n</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>
  <div id="blazor-error-ui" role="alert">
    Something went wrong. <a href="." class="reload">Reload</a>
  </div>
  <script src="js/n12d.js"></script>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
